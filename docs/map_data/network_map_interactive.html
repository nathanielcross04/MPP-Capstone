<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>State Immigration Policy Network Map</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Lato", sans-serif;
    background: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 28px 16px 16px;
    overflow: hidden
  }

  #page-title {
    font-size: 20px;
    font-weight: 700;
    color: #222222;
    letter-spacing: 0.01em;
    margin-bottom: 18px;
    text-align: center;
  }

  #page-title span {
    font-size: 20px;
    font-weight: 700;
  }
  
  #page-subtitle {
    font-size: 13px;
    color: #666;
    margin-top: -10px;
    margin-bottom: 18px;
    text-align: center;
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
  }

  #year-label {
    font-size: 17px;
    font-weight: 700;
    color: #222222;
    min-width: 42px;
    text-align: center;
  }

  #year-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 340px;
    height: 5px;
    border-radius: 3px;
    background: #cccccc;
    outline: none;
    cursor: pointer;
  }

  #year-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #444444;
    cursor: pointer;
  }

  #year-slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #444444;
    cursor: pointer;
    border: none;
  }

  #map-container {
    width: 100%;
    max-width: 960px;
    height: 680px;
    position: relative;
  }

  .map-frame {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border: none;
    visibility: hidden;
    z-index: 0;
    background: #FFFFFF;
  }
</style>
</head>
<body>

<div id="page-title">State Immigration Policy Network Map, <span id="year-label">2000</span></div>
  <div id="page-subtitle">Edges connect same-cluster states with distances less than 1.75; scroll to zoom, drag to rotate</div>

  <div id="controls">
    <span style="font-size:13px;color:#555;">2000</span>
    <input type="range" id="year-slider" min="2000" max="2019" step="1" value="2000">
    <span style="font-size:13px;color:#555;">2019</span>
  </div>

  <div id="map-container"><iframe id="map-2000" class="map-frame" src="network_map_years/map_2000.html" style="visibility:visible;z-index:1;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2001" class="map-frame" data-src="network_map_years/map_2001.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2002" class="map-frame" data-src="network_map_years/map_2002.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2003" class="map-frame" data-src="network_map_years/map_2003.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2004" class="map-frame" data-src="network_map_years/map_2004.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2005" class="map-frame" data-src="network_map_years/map_2005.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2006" class="map-frame" data-src="network_map_years/map_2006.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2007" class="map-frame" data-src="network_map_years/map_2007.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2008" class="map-frame" data-src="network_map_years/map_2008.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2009" class="map-frame" data-src="network_map_years/map_2009.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2010" class="map-frame" data-src="network_map_years/map_2010.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2011" class="map-frame" data-src="network_map_years/map_2011.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2012" class="map-frame" data-src="network_map_years/map_2012.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2013" class="map-frame" data-src="network_map_years/map_2013.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2014" class="map-frame" data-src="network_map_years/map_2014.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2015" class="map-frame" data-src="network_map_years/map_2015.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2016" class="map-frame" data-src="network_map_years/map_2016.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2017" class="map-frame" data-src="network_map_years/map_2017.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2018" class="map-frame" data-src="network_map_years/map_2018.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
<iframe id="map-2019" class="map-frame" data-src="network_map_years/map_2019.html" style="visibility:hidden;z-index:0;background:#FFFFFF;" scrolling="no"></iframe>
  </div>

  <script>
  document.addEventListener("DOMContentLoaded", function() {
    var slider    = document.getElementById("year-slider");
    var yearLabel = document.getElementById("year-label");
    var loaded    = { "2000": true };

    function showYear(yr) {
      var yrStr = String(yr);
      document.querySelectorAll(".map-frame").forEach(function(f) {
        f.style.visibility = "hidden";
        f.style.zIndex     = "0";
      });
      var target = document.getElementById("map-" + yrStr);
      if (!target) return;
      if (!loaded[yrStr]) {
        var dataSrc = target.getAttribute("data-src");
        if (dataSrc) {
          target.src = dataSrc;
          target.removeAttribute("data-src");
          loaded[yrStr] = true;
        }
      }
      target.style.visibility = "visible";
      target.style.zIndex     = "1";
      yearLabel.textContent   = yrStr;
    }

    slider.addEventListener("input", function() {
      showYear(parseInt(this.value));
    });

    showYear(2000);
  });
</script>
</body>
</html>
